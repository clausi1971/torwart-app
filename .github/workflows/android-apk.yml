name: Android-App erstellen
on:
  push:
    branches: [main]
    paths: ['index.html', 'android-build.cjs', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Android-Werkzeuge vorbereiten
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Offline-App und Signierung vorbereiten
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node android-build.cjs
          node -e "const fs=require('fs');if(!process.env.ANDROID_KEYSTORE_BASE64)throw Error('Signing secret missing');fs.writeFileSync('_android-signing.p12',Buffer.from(process.env.ANDROID_KEYSTORE_BASE64,'base64'));"
      - name: APK erstellen und Android-Pruefung ausfuehren
        run: gradle -p android --no-daemon assembleRelease lintRelease
      - name: Installationsdatei benennen
        run: cp android/app/build/outputs/apk/release/app-release.apk TorGeometrie.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TorGeometrie-Android
          path: TorGeometrie.apk
          retention-days: 30
      - name: Pruefbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Pruefbericht
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Signierdatei entfernen
        if: always()
        run: rm -f _android-signing.p12
